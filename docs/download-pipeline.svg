<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="1030" viewBox="0 0 2490 1030" role="img" aria-labelledby="title desc">
<title id="title">ClipDock technical download flowchart</title><desc id="desc">A horizontal flowchart with rounded start/end terminals, parallelogram input/output symbols, processing rectangles, and decision diamonds. Both the CLI and browser invoke URL validation and a yt-dlp worker. If media streams are available, they are selected and downloaded over HTTP, HLS or DASH. MP4 is muxed or remuxed, MP3 is encoded at a chosen bitrate, and source audio is extracted in its native codec. Output is written to disk and delivered through FastAPI FileResponse or the CLI.</desc>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#536f5b"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#223d30} .heading{font-size:27px;font-weight:700} .body{font-size:23px;fill:#526957} .code{font-family:Consolas,Menlo,monospace;font-size:21px;fill:#42634c} .edge{fill:none;stroke:#536f5b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round} .branch{font-size:21px;font-weight:700;fill:#4e6d4e} .legend{font-size:21px;fill:#64765f}</style>
<rect width="2490" height="1030" rx="24" fill="#f7f7f1"/>
<text x="45" y="48" font-size="15" letter-spacing="2" font-weight="700" fill="#819078">CLIPDOCK / TECHNICAL CONTROL FLOW</text>
<text x="45" y="101" font-size="43" font-weight="700">From video URL to a downloadable media file</text>
<text x="45" y="141" font-size="23" fill="#6d7f68">Left-to-right pipeline · shared CLI / browser engine · standard flowchart symbols</text>
<rect x="1910" y="38" width="535" height="52" rx="26" fill="#e9f0e2" stroke="#cfddc4"/>
<text x="2177" y="72" text-anchor="middle" font-size="23">YouTube · Instagram · Pinterest</text>
<rect x="40" y="380" width="110" height="80" rx="40.0" fill="#2f674c"/><text x="95.0" y="429.0" text-anchor="middle" font-size="27" font-weight="700" style="fill:white">Start</text><polygon points="220,330 430,330 400,510 190,510" fill="#eaf2e5" stroke="#7f9874" stroke-width="2"/><text x="310.0" y="370" text-anchor="middle" class="heading">URL + options</text><text x="310.0" y="401" text-anchor="middle" class="body">HTTPS video link</text><text x="310.0" y="432" text-anchor="middle" class="body">format / resolution</text><text x="310.0" y="463" text-anchor="middle" class="body">audio bitrate</text><rect x="475" y="330" width="270" height="180" rx="2" fill="#fffefa" stroke="#829a78" stroke-width="2"/><text x="610.0" y="369" text-anchor="middle" class="heading">Validate + extract</text><text x="610.0" y="400" text-anchor="middle" class="body">URL normalizer / dispatch</text><text x="610.0" y="431" text-anchor="middle" class="body">yt-dlp site extractor</text><text x="610.0" y="462" text-anchor="middle" class="body">HTTPS metadata + EJS¹</text><polygon points="780.0,420 895,305.0 1010.0,420 895,535.0" fill="#f7f0d9" stroke="#ad9b64" stroke-width="2"/><text x="895" y="396" text-anchor="middle" class="heading">Media</text><text x="895" y="428" text-anchor="middle" class="heading">streams</text><text x="895" y="460" text-anchor="middle" class="heading">available?</text><rect x="1050" y="330" width="280" height="180" rx="2" fill="#fffefa" stroke="#829a78" stroke-width="2"/><text x="1190.0" y="369" text-anchor="middle" class="heading">Select + retrieve</text><text x="1190.0" y="400" text-anchor="middle" class="body">res:target · codecs</text><text x="1190.0" y="431" text-anchor="middle" class="body">HTTP / HLS / DASH</text><text x="1190.0" y="462" text-anchor="middle" class="body">progress_hooks → JSON</text><polygon points="1390.0,420 1495,310.0 1600.0,420 1495,530.0" fill="#f7f0d9" stroke="#ad9b64" stroke-width="2"/><text x="1495" y="412" text-anchor="middle" class="heading">Output</text><text x="1495" y="444" text-anchor="middle" class="heading">format?</text><rect x="1650" y="130" width="310" height="160" rx="2" fill="#fffefa" stroke="#829a78" stroke-width="2"/><text x="1805.0" y="169" text-anchor="middle" class="heading">MP3 encoding</text><text x="1805.0" y="200" text-anchor="middle" class="body">FFmpeg audio encoder</text><text x="1805.0" y="231" text-anchor="middle" class="body">128 / 192 / 256 / 320 kbps</text><rect x="1650" y="340" width="310" height="160" rx="2" fill="#fffefa" stroke="#829a78" stroke-width="2"/><text x="1805.0" y="379" text-anchor="middle" class="heading">MP4 preparation</text><text x="1805.0" y="410" text-anchor="middle" class="body">FFmpeg mux / remux</text><text x="1805.0" y="441" text-anchor="middle" class="body">Merge tracks when needed</text><rect x="1650" y="610" width="310" height="160" rx="2" fill="#fffefa" stroke="#829a78" stroke-width="2"/><text x="1805.0" y="649" text-anchor="middle" class="heading">Source audio</text><text x="1805.0" y="680" text-anchor="middle" class="body">FFmpeg extract / copy</text><text x="1805.0" y="711" text-anchor="middle" class="body">Original codec: AAC / Opus</text><polygon points="2040,330 2260,330 2230,510 2010,510" fill="#eaf2e5" stroke="#7f9874" stroke-width="2"/><text x="2135.0" y="370" text-anchor="middle" class="heading">File output</text><text x="2135.0" y="401" text-anchor="middle" class="body">Filesystem write</text><text x="2135.0" y="432" text-anchor="middle" class="body">Web: FileResponse</text><text x="2135.0" y="463" text-anchor="middle" class="body">CLI: path + exit 0</text><text x="2135.0" y="494" text-anchor="middle" class="body">MP4 / MP3 / M4A / Opus</text><rect x="2310" y="380" width="140" height="80" rx="40.0" fill="#2f674c"/><text x="2380.0" y="429.0" text-anchor="middle" font-size="27" font-weight="700" style="fill:white">End</text><polygon points="795,650 1045,650 1015,795 765,795" fill="#fbf0e6" stroke="#b39b7c" stroke-width="2"/><text x="905.0" y="690" text-anchor="middle" class="heading">Error output</text><text x="905.0" y="721" text-anchor="middle" class="body">UI status / stderr</text><text x="905.0" y="752" text-anchor="middle" class="body">JSON + nonzero exit</text><rect x="805" y="850" width="200" height="75" rx="37.5" fill="#2f674c"/><text x="905.0" y="896.5" text-anchor="middle" font-size="27" font-weight="700" style="fill:white">End (error)</text><path d="M150 420H205" class="edge" marker-end="url(#arrow)"/><path d="M415 420H475" class="edge" marker-end="url(#arrow)"/><path d="M745 420H780" class="edge" marker-end="url(#arrow)"/><path d="M1010 420H1050" class="edge" marker-end="url(#arrow)"/><path d="M1330 420H1390" class="edge" marker-end="url(#arrow)"/><path d="M895 535V650" class="edge" marker-end="url(#arrow)"/><path d="M905 795V850" class="edge" marker-end="url(#arrow)"/><path d="M1495 310V210H1650" class="edge" marker-end="url(#arrow)"/><path d="M1600 420H1650" class="edge" marker-end="url(#arrow)"/><path d="M1495 530V690H1650" class="edge" marker-end="url(#arrow)"/><path d="M1960 210H1985V420H2025" class="edge" marker-end="url(#arrow)"/><path d="M1960 420H2025" class="edge" marker-end="url(#arrow)"/><path d="M1960 690H1985V420H2025" class="edge" marker-end="url(#arrow)"/><path d="M2245 420H2310" class="edge" marker-end="url(#arrow)"/><text x="1025" y="399" text-anchor="middle" class="branch">Yes</text><text x="925" y="595" text-anchor="middle" class="branch">No</text><text x="1565" y="191" text-anchor="middle" class="branch">MP3</text><text x="1622" y="400" text-anchor="middle" class="branch">MP4</text><text x="1570" y="675" text-anchor="middle" class="branch">Source</text><circle cx="1985" cy="420" r="5" fill="#536f5b"/>
<rect x="45" y="580" width="620" height="175" rx="12" fill="#edf2e6"/>
<text x="68" y="618" font-size="16" letter-spacing="1.4" font-weight="700" fill="#7c8c70">DISPATCH / RUNTIME NOTES</text>
<text x="68" y="657" class="body">Web: FastAPI HTTP API → ThreadPoolExecutor queue.</text>
<text x="68" y="691" class="body">CLI: argparse → direct Python worker subprocess.</text>
<text x="68" y="725" class="body">¹ Node.js + yt-dlp-ejs handle YouTube JS challenges.</text>
<line x1="45" y1="954" x2="2445" y2="954" stroke="#d9e1d0" stroke-width="2"/>
<rect x="45" y="977" width="75" height="31" rx="15.5" fill="#2f674c"/><text x="137" y="1000" class="legend">Start / End</text>
<polygon points="375,977 455,977 445,1008 365,1008" fill="#eaf2e5" stroke="#7f9874" stroke-width="2"/><text x="475" y="1000" class="legend">Input / Output</text>
<rect x="790" y="977" width="75" height="31" fill="#fffefa" stroke="#829a78" stroke-width="2"/><text x="885" y="1000" class="legend">Process</text>
<polygon points="1200,992 1234,971 1268,992 1234,1013" fill="#f7f0d9" stroke="#ad9b64" stroke-width="2"/><text x="1290" y="1000" class="legend">Decision · labelled branches</text>
