[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clipdock"
version = "0.10.1"
description = "A free local video downloader with a browser interface and command-line tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Golden-alt933"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "yt-dlp[default,curl-cffi]>=2026.10.26"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
clipdock = "clipdock.cli:main"

[project.urls]
Homepage = "https://github.com/Golden-alt933/clipdock"
Issues = "https://github.com/Golden-alt933/clipdock/issues"

[tool.setuptools.packages.find]
include = ["clipdock*"]

[tool.setuptools.package-data]
clipdock = ["static/*.html", "static/*.css", "static/*.js", "static/*.webp", "static/*.woff2", "static/*.txt"]
